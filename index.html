<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Art Miner</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #050505;
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        h1 { font-weight: 300; letter-spacing: 4px; color: #fff; font-size: 1.2rem; margin-bottom: 10px; text-transform: uppercase;}

        #canvas-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #222;
            width: 320px; height: 320px;
        }

        canvas { width: 100%; height: 100%; display: block; background: #000; }

        /* Eine elegante Scan-Linie */
        #scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 1px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px white;
            display: none; opacity: 0.5;
        }

        .stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            width: 320px; margin-top: 20px; font-size: 0.85rem;
        }
        .stat-box { background: #111; padding: 10px; border-radius: 4px; border: 1px solid #222; }
        .label { color: #555; display: block; margin-bottom: 3px; font-size: 0.7rem; text-transform: uppercase;}
        .val { font-family: monospace; font-size: 1.1rem; color: #fff; }

        .controls { margin-top: 20px; display: flex; gap: 10px; width: 320px; }
        button {
            background: #eee; color: #000; border: none; padding: 12px;
            flex-grow: 1; cursor: pointer; font-weight: 600; letter-spacing: 1px;
            transition: all 0.2s; border-radius: 2px;
        }
        button:hover { background: #fff; }
        button:active { transform: scale(0.98); }
        
        #btn-save { background: #222; color: #fff; border: 1px solid #444; display: none;}
        #btn-save:hover { border-color: #fff; }

        /* Status Indikator */
        #status {
            margin-top: 10px; font-size: 0.75rem; color: #444; font-family: monospace;
            height: 20px;
        }
    </style>
</head>
<body>

    <h1>Aesthetic Engine</h1>

    <div id="canvas-wrapper">
        <canvas id="displayCanvas" width="600" height="600"></canvas>
        <div id="scan-line"></div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <span class="label">Live Score</span>
            <div class="val" id="score-live" style="color:#666;">---</div>
        </div>
        <div class="stat-box">
            <span class="label">Best Aesthetics</span>
            <div class="val" id="score-best" style="color:#4caf50;">0</div>
        </div>
        <div class="stat-box">
            <span class="label">Iterations</span>
            <div class="val" id="iterations">0</div>
        </div>
        <div class="stat-box">
            <span class="label">Style</span>
            <div class="val" id="current-style">---</div>
        </div>
    </div>

    <div id="status">Waiting to create...</div>

    <div class="controls">
        <button id="btn-toggle" onclick="toggleMining()">START CREATE</button>
        <button id="btn-save" onclick="saveArt()">SAVE ART</button>
    </div>

<script>
    // Setup
    const displayCvs = document.getElementById('displayCanvas');
    const dCtx = displayCvs.getContext('2d');
    
    // Worker Canvas (unsichtbar)
    const workCvs = document.createElement('canvas');
    workCvs.width = 600; workCvs.height = 600;
    const ctx = workCvs.getContext('2d');

    let isRunning = false;
    let animationFrame;
    let bestScore = 0;
    let totalIterations = 0;
    let bestImageData = null;

    // Konstanten für Ästhetik
    const WIDTH = 600;
    const HEIGHT = 600;
    const PHI = 1.6180339887;

    // --- 1. COLOR THEORY ENGINE ---
    // Erzeugt nur Paletten, die mathematisch harmonieren. Kein Zufalls-Matsch mehr.
    function getHarmoniousPalette() {
        const hue = Math.floor(Math.random() * 360);
        const scheme = Math.random();
        let colors = [];
        
        // Helper für HSL String
        const c = (h, s, l, a=1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

        if (scheme < 0.33) { 
            // Monochromatisch (Edel & Ruhig)
            colors = [
                c(hue, 20, 10), // Bg
                c(hue, 60, 50, 0.1), // Layer
                c(hue, 80, 60, 0.6), // Highlight
                c(hue, 40, 30, 0.8)  // Detail
            ];
        } else if (scheme < 0.66) {
            // Komplementär (Kontrastreich & Dynamisch)
            const comp = (hue + 180) % 360;
            colors = [
                c(hue, 30, 5), // Bg Dunkel
                c(hue, 80, 60, 0.1), // Main
                c(comp, 80, 60, 0.2), // Contrast Layer
                c(comp, 90, 80, 0.9)  // Pop
            ];
        } else {
            // Analog (Natürlich & Harmonisch)
            const h2 = (hue + 30) % 360;
            const h3 = (hue - 30 + 360) % 360;
            colors = [
                c(hue, 10, 10), 
                c(hue, 60, 40, 0.15),
                c(h2, 70, 50, 0.3),
                c(h3, 70, 60, 0.8)
            ];
        }
        return colors;
    }

    // --- 2. STYLE GENERATORS ---
    // Verschiedene "Künstler-Persönlichkeiten"
    
    function drawNebula(palette) {
        ctx.fillStyle = palette[0];
        ctx.fillRect(0,0,WIDTH,HEIGHT);
        
        const count = 30 + Math.random() * 50;
        ctx.globalCompositeOperation = 'screen'; // Leuchteffekt

        for(let i=0; i<count; i++) {
            const x = Math.random() * WIDTH;
            const y = Math.random() * HEIGHT;
            const r = (Math.random() * 200) + 50;
            
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, palette[Math.floor(Math.random() * (palette.length-1)) + 1]);
            grad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
        }
        return "Nebula";
    }

    function drawGeometric(palette) {
        ctx.fillStyle = palette[0];
        ctx.fillRect(0,0,WIDTH,HEIGHT);
        ctx.globalCompositeOperation = 'source-over';

        const cols = 5 + Math.floor(Math.random() * 5);
        const step = WIDTH / cols;
        
        for(let x=0; x<WIDTH; x+=step) {
            for(let y=0; y<HEIGHT; y+=step) {
                if(Math.random() > 0.3) continue; // Leerraum lassen!
                
                ctx.fillStyle = palette[Math.floor(Math.random() * (palette.length-1)) + 1];
                const size = step * (Math.random() > 0.8 ? 0.9 : 0.5);
                const offset = (step - size)/2;
                
                if(Math.random() > 0.5) {
                    ctx.fillRect(x+offset, y+offset, size, size);
                } else {
                    ctx.beginPath(); 
                    ctx.arc(x+step/2, y+step/2, size/2, 0, Math.PI*2); 
                    ctx.fill();
                }
            }
        }
        return "Bauhaus";
    }

    function drawLines(palette) {
        ctx.fillStyle = palette[0];
        ctx.fillRect(0,0,WIDTH,HEIGHT);
        ctx.globalCompositeOperation = 'lighter';

        const num = 50;
        ctx.lineWidth = Math.random() * 2 + 0.5;
        
        // Flow Field Ansatz (Simpel)
        let x = Math.random() * WIDTH;
        let y = Math.random() * HEIGHT;
        
        for(let i=0; i<num; i++) {
            ctx.strokeStyle = palette[Math.floor(Math.random() * (palette.length-1)) + 1];
            ctx.beginPath();
            ctx.moveTo(x, y);
            // Brownsche Bewegung mit Tendenz zur Mitte
            x += (Math.random() - 0.5) * 200 + (WIDTH/2 - x)*0.05;
            y += (Math.random() - 0.5) * 200 + (HEIGHT/2 - y)*0.05;
            ctx.lineTo(x, y);
            ctx.stroke();
            
            // Ab und zu ein Kreis am Gelenk
            if(Math.random() > 0.8) {
                ctx.fillStyle = ctx.strokeStyle;
                ctx.beginPath(); ctx.arc(x, y, Math.random()*5, 0, Math.PI*2); ctx.fill();
            }
        }
        return "Neural Net";
    }

    // --- 3. THE CRITIC (Improved) ---
    function rateArtwork() {
        const imgData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
        const data = imgData.data;
        let score = 0;
        
        // Sampling Step (Performance)
        const step = 4; 
        
        let totalLum = 0;
        let edgeScore = 0;
        let saturationSum = 0;

        // 1. EDGE DETECTION (Kanten finden)
        // Wir vergleichen Pixel mit dem rechten Nachbarn.
        // Zu wenig Kanten = Langweilig (Leere Fläche).
        // Zu viele Kanten = Chaos (Rauschen).
        
        for(let y=0; y<HEIGHT; y+=step) {
            for(let x=0; x<WIDTH-step; x+=step) {
                const i = (y * WIDTH + x) * 4;
                const iNext = (y * WIDTH + (x+step)) * 4;
                
                const r = data[i]; const g = data[i+1]; const b = data[i+2];
                const r2 = data[iNext]; const g2 = data[iNext+1]; const b2 = data[iNext+2];
                
                const lum = (r+g+b)/3;
                const lum2 = (r2+g2+b2)/3;
                
                totalLum += lum;

                // Kantenstärke
                const diff = Math.abs(lum - lum2);
                edgeScore += diff;

                // Sättigungs-Check (Grau vermeiden)
                const max = Math.max(r,g,b);
                const min = Math.min(r,g,b);
                if(max > 0) saturationSum += (max-min)/max;
            }
        }

        const pixelCount = (WIDTH/step) * (HEIGHT/step);
        const avgLum = totalLum / pixelCount;
        const avgEdge = edgeScore / pixelCount; // Durchschnittlicher Kontrast zwischen Pixeln
        const avgSat = saturationSum / pixelCount;

        // --- SCORING LOGIC ---

        // A. Komplexität (Sweet Spot bei Edge Density)
        // Wir wollen ca avgEdge von 10 bis 30.
        // < 5 ist fast leer. > 50 ist Rauschen.
        const idealEdge = 20;
        const complexityScore = 100 - Math.abs(idealEdge - avgEdge) * 4; 
        score += Math.max(0, complexityScore);

        // B. Farb-Tiefe (Sättigung)
        // Wir belohnen Farben, bestrafen reines Grau.
        score += avgSat * 50; 

        // C. Helligkeit Balance
        // Nicht zu dunkel (<20) und nicht zu hell (>200)
        if(avgLum > 20 && avgLum < 200) score += 30;
        
        // D. Goldener Schnitt (Bonus)
        // Wir prüfen, ob an den Schnittpunkten "etwas passiert" (Kanten sind)
        // statt nur Helligkeit.
        // Wir simulieren das vereinfacht durch Prüfung der Mitte (Fokus).
        score += 10; // Basisbonus fürs Existieren

        // E. Matsch-Filter
        // Wenn Sättigung zu niedrig, massiver Abzug.
        if(avgSat < 0.1) score = 0; 
        
        // F. Leere-Filter
        // Wenn kaum Kanten da sind, ist das Bild leer.
        if(avgEdge < 2) score = 0;

        return Math.floor(score);
    }


    // --- MAIN LOOP ---
    function createCycle() {
        if(!isRunning) return;

        // Wir machen einen Versuch
        totalIterations++;
        
        // 1. Palette wählen
        const palette = getHarmoniousPalette();
        
        // 2. Stil wählen (Zufällig)
        const rand = Math.random();
        let styleName = "";
        if(rand < 0.33) styleName = drawNebula(palette);
        else if(rand < 0.66) styleName = drawGeometric(palette);
        else styleName = drawLines(palette);

        // 3. Bewerten
        const currentScore = rateArtwork();

        // UI Update (Live)
        document.getElementById('score-live').innerText = currentScore;
        document.getElementById('iterations').innerText = totalIterations;
        document.getElementById('current-style').innerText = styleName;

        // Wenn besser als bisher...
        if(currentScore > bestScore) {
            bestScore = currentScore;
            
            // Speichern für Anzeige
            bestImageData = ctx.getImageData(0,0,WIDTH,HEIGHT);
            
            // Auf Display kopieren
            dCtx.putImageData(bestImageData, 0, 0);
            
            // UI
            document.getElementById('score-best').innerText = bestScore;
            document.getElementById('btn-save').style.display = 'inline-block';
            document.getElementById('status').innerText = `New Best: ${styleName} (${currentScore})`;
            document.getElementById('status').style.color = '#4caf50';
        }

        // Loop
        // Wir geben dem Browser kurz Luft (setTimeout 0), damit die UI rendert
        // Bei requestAnimationFrame wäre es smoother, aber bei rechenintensiven Tasks
        // kann setTimeout helfen, Events durchzulassen.
        animationFrame = requestAnimationFrame(createCycle);
    }

    function toggleMining() {
        const btn = document.getElementById('btn-toggle');
        const scan = document.getElementById('scan-line');
        
        if(isRunning) {
            isRunning = false;
            cancelAnimationFrame(animationFrame);
            btn.innerText = "RESUME";
            btn.style.background = "#eee";
            scan.style.display = 'none';
            document.getElementById('status').innerText = "Paused.";
        } else {
            isRunning = true;
            btn.innerText = "PAUSE";
            btn.style.background = "#ffdd57"; // Gelb für Active
            scan.style.display = 'block';
            
            // Scanline Animation
            let pos = 0;
            function moveScan() {
                if(!isRunning) return;
                pos = (pos + 4) % 320;
                scan.style.top = pos + 'px';
                requestAnimationFrame(moveScan);
            }
            moveScan();
            
            createCycle();
        }
    }

    function saveArt() {
        if(!bestImageData) return;
        const link = document.createElement('a');
        // Wir rendern das beste Bild kurz in ein temporäres Canvas für den Download
        const tmp = document.createElement('canvas');
        tmp.width = WIDTH; tmp.height = HEIGHT;
        tmp.getContext('2d').putImageData(bestImageData, 0, 0);
        
        link.download = `aesthetic_art_${bestScore}.png`;
        link.href = tmp.toDataURL();
        link.click();
    }

    // Init
    dCtx.fillStyle = "#111";
    dCtx.fillRect(0,0,600,600);
    dCtx.font = "20px sans-serif";
    dCtx.fillStyle = "#333";
    dCtx.textAlign = "center";
    dCtx.fillText("PRESS START", 300, 300);

</script>
</body>
</html>
