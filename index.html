<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Blackbox Forschung</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a12;
            color: #0f0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        
        /* Visualisierung des Suchraums */
        #grid {
            display: grid;
            grid-template-columns: repeat(20, 15px);
            grid-template-rows: repeat(20, 15px);
            gap: 1px;
            margin: 20px;
            background: #222;
        }
        .cell { width: 15px; height: 15px; background: #111; transition: background 0.5s; }
        .cell.visited { background: #333; }
        .cell.active { background: #0ff; box-shadow: 0 0 10px #0ff; }
        .cell.solution { background: #f0f; box-shadow: 0 0 20px #f0f; }

        #log {
            height: 150px; width: 300px; overflow-y: auto;
            border: 1px solid #333; padding: 10px; font-size: 10px;
            color: #888;
        }
        button {
            margin-top: 20px; padding: 10px 20px; background: #004400;
            color: #0f0; border: 1px solid #0f0; cursor: pointer;
        }
        button:hover { background: #006600; }
    </style>
</head>
<body>

    <h1>Blackbox Forschung</h1>
    <p>Ziel: Finde den unbekannten Punkt (x,y) ohne Entfernungs-Angabe.</p>
    <div style="font-size: 20px; margin-bottom: 10px;">Versuche: <span id="attempts">0</span></div>

    <div id="grid"></div>

    <div id="log"></div>
    <button onclick="startSearch()">Start Experiment</button>

<script>
    // --- Konfiguration ---
    const SIZE = 20; // 20x20 Feld
    const TOTAL_CELLS = SIZE * SIZE;
    
    // Das Geheimnis (Die "ungelöste Formel")
    let secretX = Math.floor(Math.random() * SIZE);
    let secretY = Math.floor(Math.random() * SIZE);
    
    // KI Zustand
    let agent = { x: 10, y: 10 }; // Start in der Mitte
    
    // Gedächtnis: Wo war ich schon? (Exploration Map)
    // 0 = Unbekannt, 1 = Besucht
    let memory = new Array(SIZE).fill(0).map(() => new Array(SIZE).fill(0));
    
    let attempts = 0;
    let timer = null;

    // Initialisierung Grid
    const gridEl = document.getElementById('grid');
    let cells = [];
    
    for(let y=0; y<SIZE; y++) {
        for(let x=0; x<SIZE; x++) {
            let d = document.createElement('div');
            d.className = 'cell';
            d.id = `c-${x}-${y}`;
            gridEl.appendChild(d);
            cells.push(d);
        }
    }

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    // --- Die KI Logik (Intrinsic Motivation) ---
    // Da es kein "Heiß/Kalt" Feedback gibt, muss die KI sich selbst motivieren.
    // Motivation: "Gehe dorthin, wo du noch nicht warst." (Neugierde)
    
    function step() {
        attempts++;
        document.getElementById('attempts').innerText = attempts;

        // 1. Lösche alten Pfad visuell
        document.getElementById(`c-${agent.x}-${agent.y}`).className = 'cell visited';

        // 2. Entscheide wohin
        // Strategie: Schaue alle Nachbarn an. 
        // Wähle bevorzugt den, der im Memory "0" ist (Unbekannt).
        
        const moves = [
            {dx:0, dy:-1}, {dx:0, dy:1}, {dx:-1, dy:0}, {dx:1, dy:0}
        ];
        
        let bestMoves = [];
        let lowestVisits = Infinity;

        // Umgebung scannen
        moves.forEach(m => {
            let nx = agent.x + m.dx;
            let ny = agent.y + m.dy;
            
            // Rand prüfen
            if(nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
                let visits = memory[nx][ny];
                
                if (visits < lowestVisits) {
                    lowestVisits = visits;
                    bestMoves = [m];
                } else if (visits === lowestVisits) {
                    bestMoves.push(m);
                }
            }
        });

        // Zufälligen besten Move wählen
        let move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
        
        agent.x += move.dx;
        agent.y += move.dy;

        // 3. Memory Update (Lernen)
        memory[agent.x][agent.y] += 1; // Ich war hier +1 mal

        // 4. Check: Ist das die Lösung?
        // In echter Mathe wäre das der Moment, wo der Beweis aufgeht.
        if (agent.x === secretX && agent.y === secretY) {
            document.getElementById(`c-${agent.x}-${agent.y}`).className = 'cell solution';
            log(`🎉 GEFUNDEN! Koordinate (${agent.x}|${agent.y})`);
            clearInterval(timer);
            return;
        }

        // Visuelles Update
        document.getElementById(`c-${agent.x}-${agent.y}`).className = 'cell active';
    }

    function startSearch() {
        if(timer) clearInterval(timer);
        // Reset
        secretX = Math.floor(Math.random() * SIZE);
        secretY = Math.floor(Math.random() * SIZE);
        memory = new Array(SIZE).fill(0).map(() => new Array(SIZE).fill(0));
        cells.forEach(c => c.className = 'cell');
        agent = {x: Math.floor(SIZE/2), y: Math.floor(SIZE/2)};
        attempts = 0;
        
        log(`Suche gestartet. Ziel ist unbekannt.`);
        timer = setInterval(step, 50);
    }

</script>
</body>
</html>
