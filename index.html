<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Miner: Transparent Mode</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace; /* Monospace für Hacker-Look */
            background-color: #000;
            color: #0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 5px 0; font-size: 1.2rem; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        
        #canvas-container {
            border: 1px solid #333;
            margin: 10px 0;
            width: 300px;
            height: 300px;
            background: #111;
            position: relative;
        }
        
        canvas { width: 100%; height: 100%; display: block; }

        /* Overlay für den aktuellen Versuch (flackert) */
        #scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 10px #0f0;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 320px;
            margin-bottom: 10px;
            background: #111;
            padding: 10px;
            border: 1px solid #222;
            font-size: 0.8rem;
        }
        .stat-label { color: #666; }
        .stat-val { color: #fff; font-weight: bold; text-align: right;}
        
        /* Highlight für den Live-Wert */
        #current-score { color: #888; } 
        #best-score { color: #0f0; text-shadow: 0 0 5px #0f0; }

        .controls {
            display: flex; gap: 10px; width: 320px;
        }
        button {
            background: #004400;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px;
            font-size: 14px;
            cursor: pointer;
            flex-grow: 1;
            text-transform: uppercase;
            font-family: inherit;
        }
        button:active { background: #006600; color: #fff; }
        #download-btn { border-color: #ff9800; color: #ff9800; display: none;}

        #log {
            width: 320px;
            height: 60px;
            overflow: hidden;
            font-size: 10px;
            color: #444;
            margin-top: 5px;
            border-top: 1px solid #222;
            padding-top: 5px;
        }

    </style>
</head>
<body>

    <h1>Neural Art Miner</h1>
    
    <div id="canvas-container">
        <canvas id="artCanvas" width="500" height="500"></canvas>
        <div id="scan-line"></div>
    </div>

    <div class="stats-grid">
        <span class="stat-label">Versuche:</span>
        <span class="stat-val" id="count">0</span>
        
        <span class="stat-label">Live Score:</span>
        <span class="stat-val" id="current-score">---</span>

        <span class="stat-label">Highscore:</span>
        <span class="stat-val" id="best-score">0</span>
        
        <span class="stat-label">Speed:</span>
        <span class="stat-val" id="speed">0 /s</span>
    </div>

    <div class="controls">
        <button onclick="toggleMining()" id="btn-main">Start System</button>
        <button onclick="downloadArt()" id="download-btn">Save</button>
    </div>
    
    <div id="log">System bereit. Warte auf Input...</div>

<script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    
    // Worker Canvas (Hier wird gearbeitet)
    const workCanvas = document.createElement('canvas');
    workCanvas.width = 500;
    workCanvas.height = 500;
    const wCtx = workCanvas.getContext('2d');

    const PHI = 1.6180339887; 
    const W = 500;
    const H = 500;

    let isMining = false;
    let iterations = 0;
    let bestScore = 0; // Start bei 0, nicht negativ
    let lastTime = Date.now();
    let frameCount = 0;
    let animationId;
    let bestArtData = null;

    // Logging Funktion
    function log(msg) {
        const el = document.getElementById('log');
        el.innerHTML = `> ${msg}<br>` + el.innerHTML;
    }

    function getRandomPalette() {
        const h = Math.random() * 360;
        return [
            [h, 50, 20], // Dunkel
            [(h + 180) % 360, 80, 60], // Hell & Kontrast
            [(h + 30) % 360, 60, 40] // Akzent
        ];
    }

    // --- GENERATOR ---
    function generate(ctx) {
        const pal = getRandomPalette();
        
        // Background: Dunkel halten für Kontrast
        const bg = pal[0];
        ctx.fillStyle = `hsl(${bg[0]}, ${bg[1]}%, 5%)`;
        ctx.fillRect(0, 0, W, H);

        const shapes = Math.floor(Math.random() * 20) + 5;
        
        // Composite Mode zufällig wählen (das macht die coolen Lichteffekte)
        const modes = ['source-over', 'screen', 'lighter', 'overlay'];
        ctx.globalCompositeOperation = modes[Math.floor(Math.random() * modes.length)];

        for(let i=0; i<shapes; i++) {
            ctx.beginPath();
            const col = pal[Math.floor(Math.random() * pal.length)];
            ctx.fillStyle = `hsla(${col[0]}, ${col[1]}%, ${col[2]}%, ${Math.random() * 0.5})`;
            
            // Versuche Goldener Schnitt (mit Streuung)
            let x = (Math.random() > 0.5 ? W/PHI : W - W/PHI) + (Math.random()*100 - 50);
            let y = (Math.random() > 0.5 ? H/PHI : H - H/PHI) + (Math.random()*100 - 50);
            let s = (Math.random() * 100) + 20;

            if(Math.random() > 0.7) { // 30% komplett zufällig
                x = Math.random() * W; y = Math.random() * H;
            }

            if(Math.random() > 0.5) {
                ctx.arc(x, y, s, 0, Math.PI*2);
            } else {
                ctx.rect(x - s/2, y - s/2, s, s);
            }
            ctx.fill();
        }
    }

    // --- BEWERTUNG (Gefixt: Keine negativen Zahlen) ---
    function rate() {
        const imgData = wCtx.getImageData(0, 0, W, H);
        const data = imgData.data;
        
        // Sampling (Performance)
        const step = 20; 
        let totalLum = 0;
        let min = 255, max = 0;
        let goldenHits = 0;

        // Prüfpunkte für Goldenen Schnitt
        const gPoints = [
            Math.floor((H/PHI)*W + W/PHI)*4,
            Math.floor((H/PHI)*W + (W - W/PHI))*4
        ];

        for(let y=0; y<H; y+=step) {
            for(let x=0; x<W; x+=step) {
                const i = (y*W + x)*4;
                const l = (data[i] + data[i+1] + data[i+2]) / 3;
                totalLum += l;
                if(l < min) min = l;
                if(l > max) max = l;
            }
        }
        
        // Check Golden Points (einfacher Test)
        gPoints.forEach(idx => {
            if(data[idx] > 100) goldenHits++;
        });

        const avg = totalLum / ((W/step)*(H/step));
        
        let score = 0;

        // 1. Kontrast Bonus (0 bis 100 Punkte)
        score += (max - min) / 2.55; 

        // 2. Helligkeit Strafe (Wir wollen ca. Helligkeit 60-120)
        // Math.abs verhindert negativ nicht, aber zieht ab.
        // Wir nutzen Math.max(0, ...), um den Abzug zu begrenzen.
        const distFromIdeal = Math.abs(90 - avg);
        const brightnessScore = Math.max(0, 100 - distFromIdeal); 
        score += brightnessScore;

        // 3. Goldener Schnitt Bonus
        score += goldenHits * 50;

        // 4. Zufall
        score += Math.random() * 20;

        return Math.floor(score);
    }

    function mine() {
        if(!isMining) return;

        const BATCH = 5; 
        let currentBatchBest = 0;

        for(let i=0; i<BATCH; i++) {
            iterations++;
            generate(wCtx); // Auf Arbeits-Canvas malen
            const score = rate();

            currentBatchBest = score; // Für Live Anzeige

            if(score > bestScore) {
                bestScore = score;
                // Wir speichern das Bild
                bestArtData = wCtx.getImageData(0, 0, W, H);
                // Und zeigen es an
                ctx.putImageData(bestArtData, 0, 0);
                
                document.getElementById('best-score').innerText = bestScore;
                document.getElementById('download-btn').style.display = 'block';
                log(`Neuer Rekord: ${score}`);
            }
        }

        // Live Wert anzeigen (zeigt, dass gearbeitet wird)
        document.getElementById('current-score').innerText = currentBatchBest;
        document.getElementById('count').innerText = iterations.toLocaleString();

        frameCount += BATCH;
        
        // Speed Check
        if(Date.now() - lastTime > 1000) {
            document.getElementById('speed').innerText = frameCount + " /s";
            frameCount = 0;
            lastTime = Date.now();
        }

        animationId = requestAnimationFrame(mine);
    }

    function toggleMining() {
        const btn = document.getElementById('btn-main');
        const line = document.getElementById('scan-line');
        
        if(isMining) {
            isMining = false;
            cancelAnimationFrame(animationId);
            btn.innerText = "Start System";
            btn.style.background = "#004400";
            line.style.display = 'none';
            log("System pausiert.");
        } else {
            isMining = true;
            btn.innerText = "STOP";
            btn.style.background = "#aa0000";
            line.style.display = 'block';
            // Animation für Scanline
            let pos = 0;
            function moveLine() {
                if(!isMining) return;
                pos = (pos + 2) % 300;
                line.style.top = pos + 'px';
                requestAnimationFrame(moveLine);
            }
            moveLine();
            
            log("Mining gestartet...");
            mine();
        }
    }

    function downloadArt() {
        if(!bestArtData) return;
        const dCanvas = document.createElement('canvas');
        dCanvas.width = W; dCanvas.height = H;
        dCanvas.getContext('2d').putImageData(bestArtData, 0, 0);
        const link = document.createElement('a');
        link.download = `art_score_${bestScore}.png`;
        link.href = dCanvas.toDataURL();
        link.click();
    }

    // Init
    ctx.fillStyle = '#111';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#222';
    ctx.font = "20px Courier New";
    ctx.textAlign = "center";
    ctx.fillText("SYSTEM READY", W/2, H/2);

</script>
</body>
</html>
