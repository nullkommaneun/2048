<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Pet Experiment</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #222;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- Game Area --- */
        #pet-container {
            font-size: 100px;
            margin: 50px 0;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }
        #pet-container:active { transform: scale(0.9); }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        button {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
        }
        button:active { background: #666; }

        /* --- Stats Bars --- */
        .stats {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .bar-bg { width: 60%; background: #333; height: 10px; border-radius: 5px; overflow: hidden;}
        .bar-fill { height: 100%; background: #4caf50; width: 100%; transition: width 0.5s; }

        /* --- Custom Debugger (User Constraint) --- */
        #debugger {
            width: 100%;
            max-width: 400px;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            font-size: 12px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            border-radius: 4px;
        }
        .debug-line { margin-bottom: 4px; border-bottom: 1px solid #111; }
        .highlight { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Dein KI-Experiment</h1>

    <div class="stats">
        <div class="stat-row">
            <span>Hunger</span>
            <div class="bar-bg"><div class="bar-fill" id="bar-hunger"></div></div>
        </div>
        <div class="stat-row">
            <span>Spaß</span>
            <div class="bar-bg"><div class="bar-fill" id="bar-fun"></div></div>
        </div>
    </div>

    <div id="pet-container">🥚</div>
    <div id="speech-bubble" style="min-height: 20px; color: #aaa; margin-bottom: 20px; font-style: italic;">...</div>

    <div class="controls">
        <button onclick="interact('feed')">🍖 Füttern</button>
        <button onclick="interact('play')">🎾 Spielen</button>
        <button onclick="interact('scold')">🚫 Schimpfen</button>
    </div>

    <h3>Brain Log (Debugger)</h3>
    <div id="debugger"></div>
    <button onclick="resetBrain()" style="margin-top:10px; background:#500; font-size: 12px; padding: 5px;">Gehirn löschen (Reset)</button>

<script>
    // --- Konfiguration ---
    const ACTIONS = ['neutral', 'cry', 'angry', 'dance', 'sleep'];
    const STATES = ['normal', 'hungry', 'bored'];
    
    // Das Q-Table "Gehirn". Struktur: brain[State][Action] = Score
    let brain = JSON.parse(localStorage.getItem('petBrain')) || {};

    // Pet Zustand
    let petState = {
        hunger: 0, // 0 = satt, 100 = verhungert
        boredom: 0,
        currentMood: 'normal',
        lastActionTaken: 'neutral'
    };

    // Initialisierung des Gehirns, falls leer
    STATES.forEach(state => {
        if (!brain[state]) brain[state] = {};
        ACTIONS.forEach(action => {
            if (brain[state][action] === undefined) brain[state][action] = 0; // Startwert 0
        });
    });

    // --- Core Engine ---

    function log(msg, type='info') {
        const d = document.getElementById('debugger');
        const line = document.createElement('div');
        line.className = 'debug-line';
        const time = new Date().toLocaleTimeString().split(' ')[0];
        
        if(type==='brain') line.style.color = '#0ff';
        if(type==='reward') line.style.color = '#ff0';
        
        line.innerHTML = `<span style="opacity:0.5">[${time}]</span> ${msg}`;
        d.insertBefore(line, d.firstChild);
    }

    function saveBrain() {
        localStorage.setItem('petBrain', JSON.stringify(brain));
    }

    function updateUI() {
        document.getElementById('bar-hunger').style.width = (100 - petState.hunger) + '%';
        document.getElementById('bar-fun').style.width = (100 - petState.boredom) + '%';
        
        // Farbe der Balken ändern bei Gefahr
        document.getElementById('bar-hunger').style.background = petState.hunger > 70 ? '#f00' : '#4caf50';
    }

    // Entscheidungsfindung (Epsilon-Greedy Policy)
    function decideAction() {
        // 1. Bestimme aktuellen State (vereinfacht)
        let currentState = 'normal';
        if (petState.hunger > 60) currentState = 'hungry';
        else if (petState.boredom > 60) currentState = 'bored';
        
        petState.currentMood = currentState;

        // 2. Wähle Aktion
        // 20% Chance auf Zufall (Exploration), 80% das Beste tun (Exploitation)
        let chosenAction;
        let method = 'Exploit';

        if (Math.random() < 0.2) {
            chosenAction = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
            method = 'Explore (Zufall)';
        } else {
            // Suche Aktion mit höchstem Score im aktuellen State
            let bestScore = -Infinity;
            let bestActions = [];
            
            for (const action of ACTIONS) {
                const score = brain[currentState][action];
                if (score > bestScore) {
                    bestScore = score;
                    bestActions = [action];
                } else if (score === bestScore) {
                    bestActions.push(action);
                }
            }
            chosenAction = bestActions[Math.floor(Math.random() * bestActions.length)];
        }

        petState.lastActionTaken = chosenAction;
        renderPet(chosenAction);
        
        log(`State: <b>${currentState}</b> -> Action: <b>${chosenAction}</b> (${method})`, 'brain');
    }

    function renderPet(action) {
        const el = document.getElementById('pet-container');
        const bubble = document.getElementById('speech-bubble');
        let emoji = '😐';
        let text = '';

        switch(action) {
            case 'neutral': emoji = '😐'; text = "*starrt*"; break;
            case 'cry': emoji = '🥺'; text = "*wimmert*"; break;
            case 'angry': emoji = '😠'; text = "*grummelt*"; break;
            case 'dance': emoji = '💃'; text = "*tanzt*"; break;
            case 'sleep': emoji = '😴'; text = "*schnarcht*"; break;
        }
        el.textContent = emoji;
        bubble.textContent = text;
    }

    // --- User Interaction & Learning ---

    function interact(type) {
        let reward = 0;
        let feedback = "";

        // Logik: Was war "gut"?
        // Wenn das Pet Hunger hatte (State: hungry) und 'cry' oder 'angry' gezeigt hat,
        // und der User 'feed' drückt -> Das war erfolgreich!
        
        if (type === 'feed') {
            petState.hunger = Math.max(0, petState.hunger - 30);
            if (petState.currentMood === 'hungry') {
                reward = 1; 
                feedback = "Gut gemacht! Futter war nötig.";
            } else {
                reward = -0.5; // Überfüttern ist schlecht
                feedback = "War nicht hungrig. (Bestrafung)";
            }
        }
        
        if (type === 'play') {
            petState.boredom = Math.max(0, petState.boredom - 30);
            if (petState.currentMood === 'bored') {
                reward = 1;
                feedback = "Juhu! Spielen war nötig.";
            } else {
                reward = 0.1; // Spielen ist meistens okay
                feedback = "Gespielt.";
            }
        }

        if (type === 'scold') {
            reward = -2; // Starke Bestrafung für das aktuelle Verhalten
            feedback = "Du schimpfst.";
        }

        // LERNEN (Q-Learning Update Rule)
        // Neuer Wert = Alter Wert + Lernrate * (Reward - Alter Wert)
        const lr = 0.5; // Lernrate
        const oldScore = brain[petState.currentMood][petState.lastActionTaken];
        brain[petState.currentMood][petState.lastActionTaken] += lr * (reward - oldScore); // Update simplified

        saveBrain();
        updateUI();
        
        log(`Interaction: ${type} | Reward: ${reward} | Brain updated!`, 'reward');
        log(`New Score for [${petState.currentMood}][${petState.lastActionTaken}] = ${brain[petState.currentMood][petState.lastActionTaken].toFixed(2)}`);
        
        // Sofort neu entscheiden
        decideAction();
    }

    function resetBrain() {
        localStorage.removeItem('petBrain');
        location.reload();
    }

    // Game Loop (Zeit vergeht)
    setInterval(() => {
        // Bedürfnisse steigen
        petState.hunger = Math.min(100, petState.hunger + 2); // +2 pro Tick
        petState.boredom = Math.min(100, petState.boredom + 3);

        updateUI();

        // Alle 5 Ticks eine neue Entscheidung treffen, wenn nichts passiert
        if (Math.random() < 0.3) {
            decideAction();
        }
    }, 2000); // Alle 2 Sekunden

    // Start
    log("System gestartet. Warte auf State...", 'info');
    decideAction();

</script>
</body>
</html>
