<script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    
    const testCanvas = document.createElement('canvas');
    testCanvas.width = 500;
    testCanvas.height = 500;
    const tCtx = testCanvas.getContext('2d');

    let isMining = false;
    let iterations = 0;
    let bestScore = 0;
    let lastTime = Date.now();

    const PHI = 1.6180339887; 
    const W = testCanvas.width;
    const H = testCanvas.height;

    // --- Farbhilfsfunktionen (für harmonische Paletten) ---
    function hslToRgb(h, s, l) {
        let c = (1 - Math.abs(2 * l - 1)) * s;
        let x = c * (1 - Math.abs((h / 60) % 2 - 1));
        let m = l - c / 2;
        let r = 0, g = 0, b = 0;

        if (0 <= h && h < 60) { r = c; g = x; b = 0; }
        else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
        else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
        else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
        else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
        else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
        r = Math.round((r + m) * 255);
        g = Math.round((g + m) * 255);
        b = Math.round((b + m) * 255);

        return [r, g, b];
    }

    // Erzeugt eine harmonische Farbpalette (z.B. triadisch)
    function getRandomHarmonicPalette() {
        const baseHue = Math.random() * 360;
        const saturation = 0.5 + Math.random() * 0.5;
        const lightness = 0.3 + Math.random() * 0.4; // Etwas dunkler für Kontrast

        const palette = [];
        palette.push([baseHue, saturation, lightness]); // Basis
        
        // Triadische Harmonie
        palette.push([(baseHue + 120) % 360, saturation, lightness]);
        palette.push([(baseHue + 240) % 360, saturation, lightness]);
        
        // Oder Komplementär
        if (Math.random() < 0.5) {
            palette.push([(baseHue + 180) % 360, saturation, lightness]);
        } else { // Analoge
            palette.push([(baseHue + 30) % 360, saturation, lightness]);
            palette.push([(baseHue - 30 + 360) % 360, saturation, lightness]);
        }
        
        return palette;
    }


    // --- 1. Der ULTIMATIVE Komponist ---
    function generateUltimateArt() {
        const palette = getRandomHarmonicPalette();

        // Hintergrund basierend auf Palette
        const bgHsl = palette[Math.floor(Math.random() * palette.length)];
        tCtx.fillStyle = `hsl(${bgHsl[0]}, ${bgHsl[1]*100}%, ${bgHsl[2]*50}%)`; // Hintergrund ist dunkler
        tCtx.fillRect(0, 0, W, H);

        const complexity = Math.floor(Math.random() * 40) + 15; // Etwas komplexer
        tCtx.globalCompositeOperation = Math.random() > 0.5 ? 'screen' : 'overlay';
        
        const goldenLinesX = [W / PHI, W - (W / PHI)];
        const goldenLinesY = [H / PHI, H - (H / PHI)];


        for(let i=0; i<complexity; i++) {
            tCtx.beginPath();
            
            // Wähle Farbe aus Palette
            const hsl = palette[Math.floor(Math.random() * palette.length)];
            const alpha = 0.1 + Math.random() * 0.4;
            tCtx.fillStyle = `hsla(${hsl[0]}, ${hsl[1]*100}%, ${hsl[2]*100}%, ${alpha})`;
            
            let x, y, size;

            // Höhere Präferenz für goldene Platzierung
            if (Math.random() < 0.7) { // 70% Chance auf goldene Platzierung
                x = goldenLinesX[Math.floor(Math.random() * 2)] + (Math.random() * W * 0.1 - W * 0.05); // leichte Abweichung
                y = goldenLinesY[Math.floor(Math.random() * 2)] + (Math.random() * H * 0.1 - H * 0.05);
                size = Math.min(W,H) / PHI / (1 + Math.random()*2); 
            } else {
                x = Math.random() * W;
                y = Math.random() * H;
                size = Math.random() * 150 + 30;
            }

            // Mehr Formvielfalt
            const type = Math.random();
            if(type < 0.25) { // Kreis
                tCtx.arc(x, y, size, 0, Math.PI * 2);
            } else if (type < 0.5) { // Rechteck
                tCtx.rect(x - size/2, y - size/2, size, size);
            } else if (type < 0.75) { // Dreieck
                tCtx.moveTo(x, y - size);
                tCtx.lineTo(x + size, y + size/2);
                tCtx.lineTo(x - size, y + size/2);
            } else { // Linie
                 tCtx.lineWidth = Math.random() * 5 + 1;
                 tCtx.strokeStyle = `hsla(${hsl[0]}, ${hsl[1]*100}%, ${hsl[2]*100}%, ${alpha*2})`;
                 tCtx.beginPath();
                 tCtx.moveTo(x,y);
                 tCtx.lineTo(x + (Math.random()-0.5)*W*0.5, y + (Math.random()-0.5)*H*0.5);
                 tCtx.stroke();
            }
            tCtx.fill();
        }
    }
