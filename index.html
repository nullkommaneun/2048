<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Optimizer 🚚</title>
    <style>
        body {
            margin: 0;
            background: #0b0b0b;
            color: #eee;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Map Area */
        #canvas-wrapper {
            flex-grow: 1;
            position: relative;
            background: #111;
            box-shadow: inset 0 0 50px #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Dashboard */
        #dashboard {
            background: #222;
            padding: 15px;
            border-top: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            height: auto;
            z-index: 10;
        }

        .stat-box {
            background: #333;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: #aaa;
        }
        .stat-val {
            display: block;
            font-size: 1.2rem;
            color: #fff;
            font-weight: bold;
            margin-top: 2px;
            font-family: monospace;
        }
        
        button {
            grid-column: span 2;
            background: #007acc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
        }
        button:active { background: #005f9e; }
        
        /* Overlay Text */
        #status-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            font-family: monospace;
            color: #0f0;
            font-size: 12px;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

<div id="canvas-wrapper">
    <canvas id="map"></canvas>
    <div id="status-overlay">System: INITIALIZING...</div>
</div>

<div id="dashboard">
    <div class="stat-box">
        Aktuelle Distanz
        <span class="stat-val" id="val-dist" style="color: #f44336;">---</span>
    </div>
    <div class="stat-box">
        Berechnungen
        <span class="stat-val" id="val-iter">0</span>
    </div>
    <div class="stat-box">
        Beste Distanz
        <span class="stat-val" id="val-best" style="color: #4caf50;">---</span>
    </div>
    <div class="stat-box">
        Temperatur
        <span class="stat-val" id="val-temp">---</span>
    </div>
    
    <button onclick="resetSolver()">🎲 Neue Städte & Start</button>
</div>

<script>
    // --- KONFIGURATION ---
    const CITY_COUNT = 60; // Anzahl der Lieferadressen
    // Wenn dein Handy sehr stark ist, erhöhe auf 100 oder 200
    
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let cities = [];
    let currentOrder = [];
    let bestOrder = [];
    let bestDistance = Infinity;
    
    let iterations = 0;
    let temperature = 1000;
    let coolingRate = 0.995;
    let animationFrame;
    let isRunning = false;

    // --- HELPER FUNCTIONS ---

    function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Berechnet Distanz zwischen zwei Punkten
    function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    // Berechnet die Gesamtlänge einer Route
    function calcTotalDistance(order) {
        let sum = 0;
        for (let i = 0; i < order.length - 1; i++) {
            const cityA = cities[order[i]];
            const cityB = cities[order[i + 1]];
            sum += dist(cityA, cityB);
        }
        // Optional: Rückweg zum Start (Rundreise)
        // sum += dist(cities[order[order.length-1]], cities[order[0]]); 
        return sum;
    }

    // --- ALGORITHMUS (Simulated Annealing) ---
    // Wir nutzen Hitze-Simulation: Am Anfang darf man Fehler machen (um aus Sackgassen zu kommen),
    // später wird man strenger und optimiert nur noch Details.

    function solveStep() {
        // Wir machen mehrere Schritte pro Frame für Speed
        for(let k=0; k<100; k++) {
            iterations++;

            // 1. Erstelle eine neue, leicht veränderte Route (Mutation)
            // Wir nehmen einen Abschnitt und drehen ihn um (besser als simpler Tausch)
            const newOrder = currentOrder.slice();
            
            const i = Math.floor(Math.random() * newOrder.length);
            const j = Math.floor(Math.random() * newOrder.length);
            
            const start = Math.min(i, j);
            const end = Math.max(i, j);
            
            // Segment umdrehen (Reverse Swap)
            // Das entknotet überkreuzte Linien sehr effektiv
            const segment = newOrder.slice(start, end + 1);
            const reversedSegment = segment.reverse();
            newOrder.splice(start, reversedSegment.length, ...reversedSegment);

            // 2. Vergleichen
            const currentDist = calcTotalDistance(currentOrder);
            const newDist = calcTotalDistance(newOrder);

            // 3. Entscheiden: Nehmen wir die neue Route?
            // Wenn sie besser ist: JA.
            // Wenn sie schlechter ist: VIELLEICHT (abhängig von Temperatur).
            if (newDist < currentDist) {
                currentOrder = newOrder;
                if (newDist < bestDistance) {
                    bestDistance = newDist;
                    bestOrder = newOrder.slice();
                    updateStats(true);
                }
            } else {
                // Wahrscheinlichkeitsrechnung für "schlechten Zug akzeptieren"
                // e^((current - new) / temperature)
                const probability = Math.exp((currentDist - newDist) / temperature);
                if (Math.random() < probability) {
                    currentOrder = newOrder;
                }
            }
        }

        // Abkühlen
        temperature *= coolingRate;
        
        // Wenn zu kalt, Reset der Temperatur (Re-Annealing) um aus lokalen Optima zu kommen,
        // aber nicht ganz so heiß wie am Anfang.
        if (temperature < 1) {
            temperature = 200;
            // Wir starten wieder beim besten bisherigen Ergebnis
            currentOrder = bestOrder.slice();
        }

        draw();
        updateStats(false);
        
        if(isRunning) animationFrame = requestAnimationFrame(solveStep);
    }

    // --- VISUALISIERUNG ---

    function draw() {
        // Hintergrund & Fade Effekt
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, width, height);

        // 1. Zeichne die "Aktuelle Test-Route" (dünn, grau)
        // Damit man sieht, dass gearbeitet wird
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        for (let i = 0; i < currentOrder.length - 1; i++) {
            const a = cities[currentOrder[i]];
            const b = cities[currentOrder[i+1]];
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
        }
        ctx.stroke();

        // 2. Zeichne die "Beste Route bisher" (dick, bunt)
        // Wir machen einen Gradienten, damit man Start und Ende sieht
        for (let i = 0; i < bestOrder.length - 1; i++) {
            const a = cities[bestOrder[i]];
            const b = cities[bestOrder[i+1]];
            
            ctx.beginPath();
            // Farbe verläuft von Grün (Start) nach Blau (Ende)
            const hue = (i / bestOrder.length) * 180; // 0..180
            ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
            ctx.lineWidth = 3;
            
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
        }

        // 3. Zeichne Städte
        ctx.fillStyle = '#fff';
        for (let i = 0; i < cities.length; i++) {
            const c = cities[i];
            ctx.beginPath();
            ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Start und Ende hervorheben
        if(bestOrder.length > 0) {
            const startCity = cities[bestOrder[0]];
            const endCity = cities[bestOrder[bestOrder.length-1]];
            
            ctx.fillStyle = '#0f0'; // Start
            ctx.beginPath(); ctx.arc(startCity.x, startCity.y, 8, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#f00'; // Ende
            ctx.beginPath(); ctx.arc(endCity.x, endCity.y, 8, 0, Math.PI*2); ctx.fill();
        }
    }

    function updateStats(isNewRecord) {
        document.getElementById('val-iter').innerText = iterations.toLocaleString();
        document.getElementById('val-temp').innerText = temperature.toFixed(2) + "°";
        
        const distEl = document.getElementById('val-dist');
        distEl.innerText = Math.floor(calcTotalDistance(currentOrder));
        
        const bestEl = document.getElementById('val-best');
        bestEl.innerText = Math.floor(bestDistance);
        
        if(isNewRecord) {
            bestEl.style.textShadow = "0 0 10px #0f0";
            setTimeout(() => bestEl.style.textShadow = "none", 200);
        }
        
        document.getElementById('status-overlay').innerText = 
            `SYS: OPTIMIZING... [NODES: ${CITY_COUNT}]`;
    }

    // --- INITIALISIERUNG ---

    function resetSolver() {
        isRunning = false;
        cancelAnimationFrame(animationFrame);
        
        // Neue Städte generieren
        cities = [];
        // Etwas Rand lassen
        const padding = 40;
        for (let i = 0; i < CITY_COUNT; i++) {
            cities.push({
                x: Math.random() * (width - padding * 2) + padding,
                y: Math.random() * (height - padding * 2) + padding
            });
        }

        // Order initialisieren
        currentOrder = [];
        for (let i = 0; i < cities.length; i++) {
            currentOrder[i] = i;
        }
        
        // Einmal zufällig mischen für den Start
        for (let i = 0; i < currentOrder.length; i++) {
            const j = Math.floor(Math.random() * currentOrder.length);
            [currentOrder[i], currentOrder[j]] = [currentOrder[j], currentOrder[i]];
        }

        bestOrder = currentOrder.slice();
        bestDistance = calcTotalDistance(currentOrder);
        
        iterations = 0;
        temperature = 1000; // Reset Hitze
        
        isRunning = true;
        solveStep();
    }

    // Start beim Laden
    setTimeout(resetSolver, 500); // Kurz warten für Layout

</script>
</body>
</html>
