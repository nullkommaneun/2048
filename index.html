<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Mathe Solver</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- Math Display --- */
        .math-display {
            font-size: 28px;
            margin: 40px 0;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 10px;
            border-left: 5px solid #00bcd4;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .variable { color: #ff9800; font-weight: bold; }
        .constant { color: #00bcd4; }
        .target { color: #4caf50; font-weight: bold;}
        .current-val { color: #aaa; font-size: 0.8em; margin-top: 5px; display: block; text-align: center;}
        
        .variable-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #333;
            padding: 5px 10px;
            border-radius: 5px;
            min-width: 40px;
        }

        /* --- Controls & Stats --- */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #444; color: white; border: 1px solid #666;
            padding: 10px 20px; cursor: pointer; border-radius: 5px;
        }
        button:active { background: #666; }
        button.primary { background: #00bcd4; border-color: #00bcd4; color: #000; font-weight: bold; }

        .stats { width: 100%; max-width: 500px; margin-bottom: 20px; }
        .bar-bg { width: 100%; background: #333; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 5px;}
        .bar-fill { height: 100%; background: #ff9800; width: 0%; transition: width 0.2s; }

        /* --- Debugger --- */
        #debugger {
            width: 100%; max-width: 500px; background: #000; 
            border: 1px solid #333; color: #0f0; font-size: 11px; 
            padding: 10px; height: 250px; overflow-y: auto; 
            font-family: monospace; border-radius: 4px;
        }
        .debug-line { margin-bottom: 2px; border-bottom: 1px solid #111; display: flex; gap: 10px;}
        .ts { opacity: 0.5; min-width: 60px; }
    </style>
</head>
<body>

    <h1>KI Gleichungs-Löser</h1>
    <p style="color:#888; font-size: 0.9em;">Ziel: Finde x und y, damit die Gleichung stimmt.</p>

    <div class="math-display" id="equation-container">
        <span class="constant" id="coeff-x">3</span>
        <span>&middot;</span>
        <div class="variable-box">
            <span class="variable" id="var-x">0</span>
            <span class="current-val">x</span>
        </div>
        <span>+</span>
        <span class="constant" id="coeff-y">5</span>
        <span>&middot;</span>
        <div class="variable-box">
            <span class="variable" id="var-y">0</span>
            <span class="current-val">y</span>
        </div>
        <span>=</span>
        <div style="display:flex; flex-direction:column; align-items:center;">
            <span class="target" id="target-val">47</span>
            <span class="current-val" id="current-sum" style="color: #f44336;">(0)</span>
        </div>
    </div>

    <div class="stats">
        <div style="display:flex; justify-content:space-between;">
            <span>Nähe zum Ziel (Fehler minimieren)</span>
            <span id="error-display">Fehler: 47</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" id="bar-proximity"></div></div>
    </div>

    <div class="controls">
        <button class="primary" onclick="startStop()" id="btn-toggle">▶ Start Lernen</button>
        <button onclick="newEquation()">🎲 Neue Gleichung</button>
        <button onclick="resetBrain()">🧠 Gehirn löschen</button>
    </div>

    <div id="debugger"></div>

<script>
    // --- Globale Variablen ---
    // Wir definieren eine lineare Gleichung: Ax + By = Target
    let eq = {
        A: 3,
        B: 5,
        Target: 47
    };

    // Zustand der KI (Aktuelle Werte für x und y)
    // Wir begrenzen den Suchraum auf 0-15, damit es visualisierbar bleibt
    let state = { x: 0, y: 0 };
    
    let isRunning = false;
    let timer = null;
    let iteration = 0;

    // Das Q-Learning "Gehirn"
    // Map: "x,y" -> { "x+": score, "x-": score, "y+": score, "y-": score }
    let qTable = {};
    
    const ACTIONS = ['x+', 'x-', 'y+', 'y-'];
    const MAX_VAL = 20; // Suchraum Begrenzung

    // --- Engine Core ---

    function log(msg, color='#0f0') {
        const d = document.getElementById('debugger');
        const line = document.createElement('div');
        line.className = 'debug-line';
        const time = new Date().toLocaleTimeString().split(' ')[0];
        line.innerHTML = `<span class="ts">${time}</span> <span style="color:${color}">${msg}</span>`;
        d.insertBefore(line, d.firstChild);
    }

    // Gleichung berechnen
    function calculateSum() {
        return (eq.A * state.x) + (eq.B * state.y);
    }

    // Neue zufällige Gleichung
    function newEquation() {
        // Zufällige Koeffizienten zwischen 1 und 9
        eq.A = Math.floor(Math.random() * 8) + 2; 
        eq.B = Math.floor(Math.random() * 8) + 2;
        
        // Ein zufälliges "echtes" Ziel generieren, damit es lösbar ist
        const targetX = Math.floor(Math.random() * 10) + 1;
        const targetY = Math.floor(Math.random() * 10) + 1;
        eq.Target = (eq.A * targetX) + (eq.B * targetY);

        // Reset State
        state.x = 0;
        state.y = 0;
        iteration = 0;
        
        // UI Updates
        document.getElementById('coeff-x').innerText = eq.A;
        document.getElementById('coeff-y').innerText = eq.B;
        document.getElementById('target-val').innerText = eq.Target;
        
        // ACHTUNG: Wir löschen das Gehirn NICHT. 
        // Die KI muss merken, dass ihr altes Wissen bei der neuen Gleichung evtl. falsch ist!
        log(`NEUE AUFGABE: ${eq.A}x + ${eq.B}y = ${eq.Target}`, '#fff');
        updateUI();
    }

    function updateUI() {
        const currentSum = calculateSum();
        const error = Math.abs(eq.Target - currentSum);
        
        document.getElementById('var-x').innerText = state.x;
        document.getElementById('var-y').innerText = state.y;
        
        const sumEl = document.getElementById('current-sum');
        sumEl.innerText = `(${currentSum})`;
        sumEl.style.color = error === 0 ? '#4caf50' : '#f44336';

        document.getElementById('error-display').innerText = `Fehler: ${error}`;
        
        // Fehler visualisieren (Je kleiner der Fehler, desto voller der Balken)
        // Max Fehler Annahme ca. 100 für Visualisierung
        const percentage = Math.max(0, 100 - (error * 2));
        document.getElementById('bar-proximity').style.width = percentage + '%';
        document.getElementById('bar-proximity').style.background = error === 0 ? '#00ff00' : '#ff9800';
    }

    function getStateKey() {
        return `${state.x},${state.y}`;
    }

    function getQ(s, a) {
        if (!qTable[s]) qTable[s] = {};
        return qTable[s][a] || 0; // Standardwert 0
    }

    function setQ(s, a, val) {
        if (!qTable[s]) qTable[s] = {};
        qTable[s][a] = val;
    }

    // Der wichtigste Teil: Der Lernschritt
    function step() {
        iteration++;
        const currentStateKey = getStateKey();
        const currentSum = calculateSum();
        const currentError = Math.abs(eq.Target - currentSum);

        // 1. Ist das Problem gelöst?
        if (currentError === 0) {
            log(`GELÖST in Iteration ${iteration}! x=${state.x}, y=${state.y}`, '#0ff');
            stop();
            return;
        }

        // 2. Entscheidung treffen (Epsilon-Greedy)
        // Je länger wir suchen, desto weniger "Zufall" erlauben wir (Decay)
        let epsilon = Math.max(0.1, 1.0 - (iteration / 100)); 
        let action;
        
        if (Math.random() < epsilon) {
            action = ACTIONS[Math.floor(Math.random() * ACTIONS.length)]; // Explore
        } else {
            // Exploit: Finde Aktion mit höchstem Q-Wert
            let bestVal = -Infinity;
            let candidates = [];
            ACTIONS.forEach(a => {
                let val = getQ(currentStateKey, a);
                if (val > bestVal) { bestVal = val; candidates = [a]; }
                else if (val === bestVal) candidates.push(a);
            });
            action = candidates[Math.floor(Math.random() * candidates.length)];
        }

        // 3. Aktion ausführen (Virtuell)
        let nextState = { ...state };
        if (action === 'x+') nextState.x++;
        if (action === 'x-') nextState.x--;
        if (action === 'y+') nextState.y++;
        if (action === 'y-') nextState.y--;

        // Grenzen einhalten (Constraint)
        if (nextState.x < 0) nextState.x = 0;
        if (nextState.y < 0) nextState.y = 0;
        if (nextState.x > MAX_VAL) nextState.x = MAX_VAL;
        if (nextState.y > MAX_VAL) nextState.y = MAX_VAL;

        // 4. Belohnung berechnen (Reward Function)
        const nextSum = (eq.A * nextState.x) + (eq.B * nextState.y);
        const nextError = Math.abs(eq.Target - nextSum);
        
        let reward = 0;

        // Logik: Hat die Aktion den Fehler verringert?
        if (nextError < currentError) {
            reward = 1; // Gut! Wärmer!
        } else if (nextError > currentError) {
            reward = -2; // Schlecht! Kälter!
        } else {
            reward = -0.5; // Stillstand ist Zeitverschwendung
        }
        
        // Wenn wir exakt treffen, Jackpot!
        if (nextError === 0) reward = 20;

        // 5. Gehirn updaten (Q-Learning Formel)
        // NeuerWert = AlterWert + Lernrate * (Reward + Discount * MaxZukunft - AlterWert)
        const alpha = 0.5; // Lernrate
        const gamma = 0.8; // Discount factor (Wie wichtig ist die Zukunft?)
        
        const nextStateKey = `${nextState.x},${nextState.y}`;
        
        // Finde besten Wert vom nächsten State (für die Formel)
        let maxNextQ = -Infinity;
        ACTIONS.forEach(a => {
            let val = getQ(nextStateKey, a);
            if (val > maxNextQ) maxNextQ = val;
        });
        if (maxNextQ === -Infinity) maxNextQ = 0;

        const currentQ = getQ(currentStateKey, action);
        const newQ = currentQ + alpha * (reward + (gamma * maxNextQ) - currentQ);
        
        setQ(currentStateKey, action, newQ);

        // State übernehmen
        // WICHTIG: Auch wenn die Aktion schlecht war, übernehmen wir den State manchmal,
        // damit die KI aus der Sackgasse rauskommt. Aber meistens wollen wir nur gute Moves.
        // Hier simplified: Wir gehen immer.
        state = nextState;

        log(`${action} -> Error: ${nextError} (Reward: ${reward})`, reward > 0 ? '#ff0' : '#777');
        updateUI();
    }

    // --- Controls ---

    function startStop() {
        const btn = document.getElementById('btn-toggle');
        if (isRunning) {
            stop();
        } else {
            isRunning = true;
            btn.innerText = "⏸ Pause";
            btn.style.background = "#f44336";
            timer = setInterval(step, 100); // Speed: 10 Schritte pro Sekunde
        }
    }

    function stop() {
        isRunning = false;
        clearInterval(timer);
        const btn = document.getElementById('btn-toggle');
        btn.innerText = "▶ Weiter lernen";
        btn.style.background = "#00bcd4";
    }

    function resetBrain() {
        qTable = {};
        log("Gehirn (Q-Table) gelöscht.", '#f0f');
    }

    // Start Setup
    newEquation();

</script>
</body>
</html>
