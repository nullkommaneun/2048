<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Miner 💎</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.5rem; }
        
        /* Das "Meisterwerk" */
        #canvas-container {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 4px solid #333;
            margin-bottom: 20px;
            width: 300px;
            height: 300px;
            background: #000;
        }
        
        canvas { width: 100%; height: 100%; }

        /* UI Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .stat-val { color: #fff; font-weight: bold; font-family: monospace; }

        /* Mining Animation */
        .mining-status {
            font-family: monospace;
            font-size: 0.8rem;
            color: #0f0;
            margin-bottom: 10px;
            height: 20px;
        }

        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        
        .controls {
            display: flex; gap: 10px;
        }
        
        #download-btn { background: #ff9800; display: none;}

    </style>
</head>
<body>

    <h1>CPU Art Miner</h1>
    
    <div class="mining-status" id="status-line">Initialisiere Mining-Worker...</div>

    <div id="canvas-container">
        <canvas id="artCanvas" width="500" height="500"></canvas>
    </div>

    <div class="stats-grid">
        <div>Geprüfte Werke:</div>
        <div class="stat-val" id="count">0</div>
        
        <div>Bester Score:</div>
        <div class="stat-val" id="best-score">0</div>
        
        <div>CPU Speed:</div>
        <div class="stat-val" id="speed">0 it/s</div>
    </div>

    <div class="controls">
        <button onclick="toggleMining()" id="btn-main">⛏️ Start Mining</button>
        <button onclick="downloadArt()" id="download-btn">💾 Speichern</button>
    </div>

<script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    
    // Wir nutzen ein zweites Canvas im Speicher für die wilden Experimente
    const testCanvas = document.createElement('canvas');
    testCanvas.width = 500;
    testCanvas.height = 500;
    const tCtx = testCanvas.getContext('2d');

    let isMining = false;
    let iterations = 0;
    let bestScore = 0;
    let lastTime = Date.now();
    let frameCount = 0;
    let animationId;

    // --- 1. Der Künstler (Erstellt Zufall) ---
    function generateRandomArt() {
        const w = testCanvas.width;
        const h = testCanvas.height;
        
        // Reset Background
        tCtx.fillStyle = `hsl(${Math.random()*360}, 20%, 10%)`;
        tCtx.fillRect(0, 0, w, h);

        // Wähle ein "Thema" (Farbpalette)
        const hueBase = Math.random() * 360;
        const complexity = Math.floor(Math.random() * 50) + 10;

        tCtx.globalCompositeOperation = Math.random() > 0.5 ? 'screen' : 'overlay';

        for(let i=0; i<complexity; i++) {
            tCtx.beginPath();
            const hue = (hueBase + Math.random() * 60 - 30) % 360;
            tCtx.fillStyle = `hsla(${hue}, ${60 + Math.random()*40}%, 50%, ${Math.random()*0.3})`;
            
            const type = Math.random();
            const x = Math.random() * w;
            const y = Math.random() * h;
            const size = Math.random() * 200 + 20;

            if(type < 0.33) {
                tCtx.arc(x, y, size, 0, Math.PI * 2);
            } else if (type < 0.66) {
                tCtx.rect(x - size/2, y - size/2, size, size);
            } else {
                tCtx.moveTo(x, y);
                tCtx.lineTo(x + Math.random()*100, y + Math.random()*100);
                tCtx.lineTo(x - Math.random()*100, y + Math.random()*100);
            }
            tCtx.fill();
        }
    }

    // --- 2. Der Kritiker (Bewertet "Schönheit") ---
    // Wir bewerten hier Symmetrie und Farb-Verteilung
    function calculateBeautyScore() {
        const imgData = tCtx.getImageData(0, 0, 100, 100); // Wir sampeln nur klein für Speed
        const data = imgData.data;
        let score = 0;

        // Kriterium A: Helligkeit (Nicht zu dunkel, nicht zu hell)
        let totalBrightness = 0;
        for(let i=0; i<data.length; i+=4) {
            totalBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
        }
        const avgBright = totalBrightness / (data.length/4);
        // Beste Helligkeit liegt bei ca 128. Abweichung gibt Abzug.
        score += 100 - Math.abs(128 - avgBright);

        // Kriterium B: Symmetrie-Check (Horizontal)
        // Wir prüfen ein paar Punkte links vs rechts
        let symmetryDiff = 0;
        // Loop durch linke Hälfte
        for(let y=0; y<100; y+=5) {
            for(let x=0; x<50; x+=5) {
                const iL = (y * 100 + x) * 4;
                const iR = (y * 100 + (99-x)) * 4;
                
                const diffR = Math.abs(data[iL] - data[iR]);
                const diffG = Math.abs(data[iL+1] - data[iR+1]);
                const diffB = Math.abs(data[iL+2] - data[iR+2]);
                
                symmetryDiff += (diffR + diffG + diffB);
            }
        }
        // Weniger Diff = Mehr Punkte. Aber wir wollen keine perfekte Symmetrie (langweilig),
        // sondern "interessante" Balance.
        // Wir invertieren den Score hier mal testweise:
        score += Math.max(0, (50000 - symmetryDiff) / 500);

        // Kriterium C: Zufallsfaktor (Geschmackssache der KI)
        score += Math.random() * 50;

        return Math.floor(score);
    }

    // --- 3. Der Loop (Die Mine) ---
    function mineBlock() {
        if(!isMining) return;

        // Wir machen mehrere Versuche pro Frame, damit die CPU schwitzt
        const BATCH_SIZE = 5; 
        
        for(let i=0; i<BATCH_SIZE; i++) {
            iterations++;
            generateRandomArt();
            const score = calculateBeautyScore();

            // Nur wenn es das beste bisher ist, zeigen wir es an
            if(score > bestScore) {
                bestScore = score;
                // Kopiere vom Test-Canvas auf das Sichtbare
                ctx.drawImage(testCanvas, 0, 0);
                
                document.getElementById('best-score').innerText = bestScore;
                document.getElementById('status-line').innerText = `💎 GEFUNDEN! Score: ${score}`;
                document.getElementById('download-btn').style.display = 'block';
                
                // Kurze Pause fürs Auge bei Fund
                // (Optional, hier lassen wir es durchlaufen)
            }
        }

        frameCount += BATCH_SIZE;
        document.getElementById('count').innerText = iterations.toLocaleString();

        // Speed Berechnung
        const now = Date.now();
        if(now - lastTime > 1000) {
            document.getElementById('speed').innerText = frameCount + " Werke/s";
            document.getElementById('status-line').innerText = "Mining läuft... CPU arbeitet.";
            frameCount = 0;
            lastTime = now;
        }

        animationId = requestAnimationFrame(mineBlock);
    }

    function toggleMining() {
        const btn = document.getElementById('btn-main');
        if(isMining) {
            isMining = false;
            cancelAnimationFrame(animationId);
            btn.innerText = "⛏️ Start Mining";
            btn.style.background = "#2196f3";
            document.getElementById('status-line').innerText = "Pausiert.";
        } else {
            isMining = true;
            btn.innerText = "⏸ Pause";
            btn.style.background = "#f44336";
            mineBlock();
        }
    }

    function downloadArt() {
        const link = document.createElement('a');
        link.download = `art-miner-${bestScore}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    // Initiales Bild
    ctx.fillStyle = "#222";
    ctx.fillRect(0,0,500,500);
    ctx.fillStyle = "#333";
    ctx.font = "30px monospace";
    ctx.textAlign = "center";
    ctx.fillText("Bereit zum Minen", 250, 250);

</script>
</body>
</html>
