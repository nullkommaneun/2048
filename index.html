<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldener Schnitt Art Miner FINAL</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: gold; }
        
        #canvas-container {
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
            border: 2px solid #333;
            margin-bottom: 20px;
            width: 300px;
            height: 300px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas { width: 100%; height: 100%; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 300px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #aaa;
            background: #222;
            padding: 10px;
            border-radius: 8px;
        }
        .stat-val { color: #fff; font-weight: bold; font-family: monospace; font-size: 1.1em;}

        .mining-status {
            font-family: monospace;
            font-size: 0.8rem;
            color: #0f0;
            margin-bottom: 10px;
            height: 20px;
            text-align: center;
            width: 100%;
        }

        .controls {
            display: flex; flex-direction: column; gap: 10px; width: 300px;
        }
        
        .btn-row { display: flex; gap: 10px; width: 100%; }

        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            flex-grow: 1;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.95); opacity: 0.8; }
        
        #btn-main { background: #2196f3; }
        #download-btn { background: #ff9800; display: none; }
        #reset-btn { background: #444; font-size: 0.9em;}

    </style>
</head>
<body>

    <h1>Art Miner ⚜️</h1>
    
    <div class="mining-status" id="status-line">Lade System...</div>

    <div id="canvas-container">
        <canvas id="artCanvas" width="500" height="500"></canvas>
    </div>

    <div class="stats-grid">
        <div>Geprüfte Werke:</div>
        <div class="stat-val" id="count">0</div>
        
        <div>Bester Score:</div>
        <div class="stat-val" id="best-score">0</div>
        
        <div>Speed:</div>
        <div class="stat-val" id="speed">0 /s</div>
    </div>

    <div class="controls">
        <button onclick="toggleMining()" id="btn-main">⛏️ STARTEN</button>
        <div class="btn-row">
            <button onclick="downloadArt()" id="download-btn">💾 Speichern</button>
            <button onclick="resetMiner()" id="reset-btn">🔄 Reset</button>
        </div>
    </div>

<script>
    // Globale Variablen Setup
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    
    // Unsichtbares Arbeits-Canvas
    const testCanvas = document.createElement('canvas');
    testCanvas.width = 500;
    testCanvas.height = 500;
    const tCtx = testCanvas.getContext('2d');

    // Konstanten
    const PHI = 1.6180339887; 
    const W = testCanvas.width;
    const H = testCanvas.height;

    // State
    let isMining = false;
    let iterations = 0;
    let bestScore = -Infinity;
    let lastTime = Date.now();
    let frameCount = 0;
    let animationId;
    let bestArtData = null;

    // --- HARMONIE FUNKTIONEN ---

    function getRandomHarmonicPalette() {
        const baseHue = Math.random() * 360;
        // Sättigung und Helligkeit für Web-Colors (0-100%)
        const s = 50 + Math.random() * 50; 
        const l = 30 + Math.random() * 40; 

        const palette = [];
        palette.push([baseHue, s, l]); // Basis
        
        // Harmonie-Typ wählen
        const type = Math.random();
        if (type < 0.33) { // Triadisch
            palette.push([(baseHue + 120) % 360, s, l]);
            palette.push([(baseHue + 240) % 360, s, l]);
        } else if (type < 0.66) { // Komplementär & Split
            palette.push([(baseHue + 180) % 360, s, l]);
            palette.push([(baseHue + 150) % 360, s, l]);
        } else { // Analog
            palette.push([(baseHue + 30) % 360, s, l]);
            palette.push([(baseHue - 30 + 360) % 360, s, l]);
        }
        return palette;
    }

    // --- GENERATOR ---
    function generateUltimateArt() {
        const palette = getRandomHarmonicPalette();

        // Hintergrund
        const bg = palette[0];
        tCtx.fillStyle = `hsl(${bg[0]}, ${bg[1] * 0.5}%, 10%)`; // Sehr dunkler Background im Farbton
        tCtx.fillRect(0, 0, W, H);

        // Komplexität
        const complexity = 15 + Math.floor(Math.random() * 35);
        tCtx.globalCompositeOperation = Math.random() > 0.5 ? 'screen' : 'lighter';
        
        // Goldene Linien Koordinaten
        const gX = [W / PHI, W - (W / PHI)];
        const gY = [H / PHI, H - (H / PHI)];

        for(let i=0; i<complexity; i++) {
            tCtx.beginPath();
            
            // Farbe
            const col = palette[Math.floor(Math.random() * palette.length)];
            const alpha = 0.1 + Math.random() * 0.5;
            tCtx.fillStyle = `hsla(${col[0]}, ${col[1]}%, ${col[2]}%, ${alpha})`;
            tCtx.strokeStyle = `hsla(${col[0]}, ${col[1]}%, ${col[2]}%, ${alpha})`;
            
            // Position & Größe
            let x, y, size;
            
            // 80% Wahrscheinlichkeit für harmonische Platzierung
            if (Math.random() < 0.8) {
                // Snap to golden lines mit leichtem Jitter
                x = gX[Math.floor(Math.random()*2)] + (Math.random()*40 - 20);
                y = gY[Math.floor(Math.random()*2)] + (Math.random()*40 - 20);
                // Größe basierend auf Goldenem Schnitt
                size = (Math.min(W,H) / PHI) / (1 + Math.random()*3); 
            } else {
                x = Math.random() * W;
                y = Math.random() * H;
                size = Math.random() * 100 + 20;
            }

            // Form
            const shape = Math.random();
            if(shape < 0.3) { // Kreis
                tCtx.arc(x, y, size, 0, Math.PI * 2);
                tCtx.fill();
            } else if (shape < 0.6) { // Rechteck
                tCtx.rect(x - size/2, y - size/2, size, size);
                tCtx.fill();
            } else { // Linie / Struktur
                tCtx.lineWidth = 1 + Math.random() * 5;
                tCtx.moveTo(x, y);
                tCtx.lineTo(x + (Math.random()-0.5)*200, y + (Math.random()-0.5)*200);
                tCtx.stroke();
            }
        }
    }

    // --- ANALYSER (Der Kritiker) ---
    function calculateScore() {
        // Pixel-Daten holen (Performance-Heavy!)
        const imgData = tCtx.getImageData(0, 0, W, H); 
        const data = imgData.data;
        let score = 0;

        // Wir prüfen nur jeden 10. Pixel für Performance (Mobile Optimierung)
        // Das reicht für statistische Ästhetik völlig aus
        const step = 10; 
        
        let totalLum = 0;
        let minLum = 255, maxLum = 0;
        let centerMass = 0;

        for(let y=0; y<H; y+=step) {
            for(let x=0; x<W; x+=step) {
                const i = (y * W + x) * 4;
                // Einfache Luminanz (Helligkeit)
                const lum = (data[i] + data[i+1] + data[i+2]) / 3;
                
                totalLum += lum;
                if(lum < minLum) minLum = lum;
                if(lum > maxLum) maxLum = lum;

                // Center Bias (Helligkeit in der Mitte ist gut)
                const dx = x - W/2;
                const dy = y - H/2;
                if (dx*dx + dy*dy < 100*100) {
                    centerMass += lum;
                }
            }
        }

        const pixelsChecked = (W/step) * (H/step);
        const avgLum = totalLum / pixelsChecked;

        // 1. Kontrast-Score (Wir wollen Dynamik!)
        score += (maxLum - minLum) * 2;

        // 2. Helligkeits-Balance (Nicht zu dunkel, nicht zu weiß)
        // Idealwert ca 80-100 (auf einer 0-255 Skala für abstrakte Kunst auf Schwarz)
        score += 200 - Math.abs(90 - avgLum) * 2;

        // 3. Fokus (Mitte sollte heller sein als Rand -> Vignette Effekt natürlich erzeugt)
        score += (centerMass / pixelsChecked) * 0.5;

        // 4. Goldener Schnitt Prüfung (Sampling an den Linien)
        // Wir prüfen 4 Punkte
        const checkPoints = [
            ((H/PHI) * W + (W/PHI)) * 4,
            ((H/PHI) * W + (W - W/PHI)) * 4,
            ((H - H/PHI) * W + (W/PHI)) * 4,
            ((H - H/PHI) * W + (W - W/PHI)) * 4
        ];

        let goldenHits = 0;
        checkPoints.forEach(idx => {
            idx = Math.floor(idx);
            // Ist an diesen Punkten "etwas los" (heller als Durchschnitt)?
            if (data[idx] + data[idx+1] + data[idx+2] > avgLum * 3 + 50) {
                goldenHits++;
            }
        });
        score += goldenHits * 150; // Großer Bonus für Treffer am Goldenen Schnitt

        // Zufallsfaktor für kreative Überraschungen
        score += Math.random() * 50;

        return Math.floor(score);
    }

    // --- MINING LOOP ---
    function mine() {
        if(!isMining) return;

        // Mobile Optimierung: Weniger pro Frame, damit UI responsive bleibt
        const batch = 3; 

        try {
            for(let i=0; i<batch; i++) {
                iterations++;
                generateUltimateArt();
                const score = calculateScore();

                if(score > bestScore) {
                    bestScore = score;
                    // Speichern
                    bestArtData = tCtx.getImageData(0, 0, W, H);
                    // Anzeigen
                    ctx.putImageData(bestArtData, 0, 0);
                    
                    // UI Update sofort bei Fund
                    document.getElementById('best-score').innerText = bestScore;
                    document.getElementById('status-line').innerText = `💎 GEFUNDEN! Score: ${score}`;
                    document.getElementById('status-line').style.color = '#fff';
                    document.getElementById('download-btn').style.display = 'block';
                }
            }
        } catch (e) {
            console.error(e);
            isMining = false;
            document.getElementById('status-line').innerText = "Fehler im Mining Prozess.";
        }

        frameCount += batch;
        document.getElementById('count').innerText = iterations.toLocaleString();

        const now = Date.now();
        if(now - lastTime > 1000) {
            document.getElementById('speed').innerText = frameCount + " /s";
            if(frameCount > 0 && isMining) {
                document.getElementById('status-line').innerText = "Analysiere Kompositionen...";
                document.getElementById('status-line').style.color = '#0f0';
            }
            frameCount = 0;
            lastTime = now;
        }

        animationId = requestAnimationFrame(mine);
    }

    // --- BUTTON FUNCTIONS ---
    function toggleMining() {
        const btn = document.getElementById('btn-main');
        if(isMining) {
            isMining = false;
            cancelAnimationFrame(animationId);
            btn.innerText = "⛏️ WEITER SUCHEN";
            btn.style.background = "#2196f3";
            document.getElementById('status-line').innerText = "Pausiert.";
        } else {
            isMining = true;
            btn.innerText = "⏸ PAUSE";
            btn.style.background = "#f44336";
            mine();
        }
    }

    function downloadArt() {
        if (!bestArtData) return;
        
        const dCanvas = document.createElement('canvas');
        dCanvas.width = W;
        dCanvas.height = H;
        dCanvas.getContext('2d').putImageData(bestArtData, 0, 0);

        const link = document.createElement('a');
        link.download = `Meisterwerk-${bestScore}.png`;
        link.href = dCanvas.toDataURL();
        link.click();
    }

    function resetMiner() {
        isMining = false;
        cancelAnimationFrame(animationId);
        
        iterations = 0;
        bestScore = -Infinity;
        bestArtData = null;
        
        document.getElementById('count').innerText = "0";
        document.getElementById('best-score').innerText = "0";
        document.getElementById('speed').innerText = "0 /s";
        document.getElementById('btn-main').innerText = "⛏️ STARTEN";
        document.getElementById('btn-main').style.background = "#2196f3";
        document.getElementById('download-btn').style.display = 'none';
        
        // Startbildschirm zeichnen
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#444";
        ctx.font = "20px monospace";
        ctx.textAlign = "center";
        ctx.fillText("Bereit.", W/2, H/2);

        document.getElementById('status-line').innerText = "System Bereit.";
        document.getElementById('status-line').style.color = '#0f0';
    }

    // --- INIT ---
    window.onload = function() {
        resetMiner();
    };

</script>
</body>
</html>
